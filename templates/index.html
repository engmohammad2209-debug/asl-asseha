<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>شركة أصل الصحة - المساعد الذكي</title>
<style>
    body {
        font-family: 'Segoe UI', Tahoma, sans-serif;
        background: #f4f6f9;
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }
    #chat-container {
        width: 100%;
        max-width: 500px;
        height: 90vh;
        background: white;
        border-radius: 10px;
        box-shadow: 0 0 15px rgba(0,0,0,0.1);
        display: flex;
        flex-direction: column;
    }
    #chat-box {
        flex: 1;
        overflow-y: auto;
        padding: 15px;
    }
    .msg {
        margin-bottom: 15px;
        white-space: pre-wrap;
        line-height: 1.5;
    }
    .user {
        color: #0056b3;
        font-weight: bold;
        text-align: right;
    }
    .bot {
        color: #1e7e34;
        text-align: right;
    }
    #input-area {
        display: flex;
        padding: 10px;
        border-top: 1px solid #ddd;
    }
    #user-input {
        flex: 1;
        padding: 10px;
        font-size: 16px;
        border: 1px solid #ccc;
        border-radius: 5px;
        text-align: right;
    }
    #send-btn {
        margin-right: 8px;
        padding: 10px 20px;
        background: #007bff;
        color: white;
        border: none;
        border-radius: 5px;
        font-weight: bold;
        cursor: pointer;
    }
</style>
</head>
<body>

<div id="chat-container">
    <div id="chat-box">
        <div class="msg bot">أهلاً بك في شركة أصل الصحة للخدمات العلاجية! 🏥
اسألني مباشرة عن أي موضوع، مثل:

🔹 موقع وعنوان الشركة
🔹 الدول والخدمات العلاجية والمتابعة (الهند / تركيا)
🔹 الاستفسار عن الأسعار وإرسال التقارير
🔹 رقم الواتساب والتواصل المباشر</div>
    </div>
    <div id="input-area">
        <button id="send-btn" onclick="sendMessage()">إرسال</button>
        <input type="text" id="user-input" placeholder="اكتب سؤالك هنا..." onkeypress="if(event.key==='Enter') sendMessage()">
    </div>
</div>

<script>
async function sendMessage() {
    const input = document.getElementById("user-input");
    const msg = input.value.trim();
    if (!msg) return;

    const chatBox = document.getElementById("chat-box");
    chatBox.innerHTML += `<div class="msg user">أنت: ${msg}</div>`;
    input.value = "";

    const res = await fetch("/chat", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({message: msg})
    });
    const data = await res.json();
    chatBox.innerHTML += `<div class="msg bot">البوت:
${data.response}</div>`;
    chatBox.scrollTop = chatBox.scrollHeight;
}
</script>

</body>
</html>
